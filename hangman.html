
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="hangman.css">
    <script src="hangman.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman</title>
</head>
<body>
    <div>
        <img id="hangmanpic" src="images/hangman6.gif" alt="Picture of Hangman">
    </div>

    <div id="clue">Press New Game to Play</div>

    <div>
        <input type="text" id="guess" size="1" maxlength="1" disabled>
        <button id="guessButton" onclick="guess();" disabled>Guess</button>
    </div>

    <div id="guesses"></div>

    <div id="newgamearea">
        <button onclick="newGame();">New Game</button>
    </div>
</body>
</html>
